# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build Shared
      run: dotnet build ReadOtter.Shared/ReadOtter.Shared.csproj
    - name: Test
      run: dotnet test ReadOtter.Tests/ReadOtter.Tests.csproj --verbosity normal

  build-maui:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Install MAUI workload
      run: dotnet workload install maui
    - name: Build MAUI
      run: dotnet build ReadOtter/ReadOtter.csproj -f net9.0-windows10.0.19041.0
